---
type: showroom

# Set the left column width to 30%
default_width: 30
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # Placeholder tabs render a stub panel for local development so you
  # can preview the layout without running real services (wetty, OCP
  # console, etc.).  Replace with real URLs/paths before deploying.
  #
  # Requires nookbag-bundle v0.4.0+.

  - name: ">_ terminal"
    url: /placeholder

  - name: OCP Console
    url: /placeholder
